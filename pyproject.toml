[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ga4-ai-bridge"
version = "1.0.0"
description = "Universal Google Analytics 4 (GA4) CLI bridge for AI coding assistants (Claude Code, Cline, Cursor, Copilot)"
readme = "README.md"
authors = [{ name = "Anton Lisitskyi" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.2.0"
]

[project.scripts]
ga4 = "ga4_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
